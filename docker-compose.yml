services:
  postgres:
    image: postgres:16-alpine
    container_name: mastery-postgres-local
    restart: unless-stopped
    # Pointing the DB to your backend folder to sync credentials
    env_file:
      - backend/.env
    ports:
      - "55432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      # Using variables for the healthcheck so it works if you change the username
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mastery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: mastery-neo4j
    restart: unless-stopped
    # Syncing Neo4j auth with the backend's secret file
    env_file:
      - backend/.env
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: mastery-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mastery-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Logic-based defaults (keeping these for flexibility)
      ENV: ${ENV:-dev}
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-http://ai-core:10001}
      AI_CORE_TIMEOUT_SECONDS: ${AI_CORE_TIMEOUT_SECONDS:-40}
      AI_CORE_ALLOW_FALLBACK: ${AI_CORE_ALLOW_FALLBACK:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_NEO4J_GRAPH: ${USE_NEO4J_GRAPH:-true}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-MasteryAI}
      # The rest (DATABASE_URL, NEO4J_URI, etc) are pulled automatically from backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
    command: >
      sh -c "python -m alembic -c backend/alembic.ini upgrade head &&
      python -m uvicorn backend.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"

  ai-core:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: ai_core/Dockerfile
    container_name: mastery-ai-core
    restart: unless-stopped
    env_file:
      - ai_core/.env
      - backend/.env # Also pulling from backend/.env to sync DB passwords
    environment:
      PORT: ${AI_CORE_PORT:-10001}
      # Logic defaults
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
      backend:
        condition: service_started
    command: >
      sh -c "python -m uvicorn ai_core.main:app --host 0.0.0.0 --port 10001"
    ports:
      - "10001:10001"

volumes:
  postgres_local_data:
  redis_data:
  neo4j_data:
  qdrant_data: